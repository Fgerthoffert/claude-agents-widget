[package]
name = "claude-agents-widget"
version = "0.5.0"
description = "Always-on macOS menu bar icon + floating panel showing every local Claude Code session"
authors = ["Francois Gerthoffert"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "claude_agents_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Detection core (phase 2): watching the session state dir and running `ps`.
#
# `watch` is NOT a default feature: without it `tauri_plugin_fs` never registers its `watch`
# command, so `watchImmediate()` rejects with "command not found" at runtime while everything
# still compiles and every jsdom test still passes. That is exactly what shipped in v0.2.0 and
# it took the whole detection pipeline down with it (ADR-0011).
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-shell = "2"
# Failures must land somewhere a user can read without devtools (ADR-0011).
tauri-plugin-log = "2"
log = "0.4"
# UI surfaces (phase 3): panel geometry persistence, Quit and launch-at-login from the
# TypeScript tray menu.
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"

# Floating above other apps' full-screen Spaces (ADR-0010) needs the panel window to *be* an
# NSPanel, which is unreachable from TypeScript and from Tauri's window API. Not published to
# crates.io, so it is pinned by revision rather than tracking the `v2.1` branch head.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "c9ec2130422200f0863b23dfdad02b133a529b07" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
